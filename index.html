:root{
  --bg:#EEF2F1;--surface:#FFFFFF;--surface-2:#E4EBE9;--ink:#17222A;--ink-2:#52616A;--line:#D2DBD9;
  --accent:#16655F;--accent-ink:#FFFFFF;--accent-soft:#D5E9E5;--ochre:#9A5B14;--ochre-soft:#F4E5CE;--done:#2E7D4F;
  --serif:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0F1517;--surface:#172024;--surface-2:#1F2A2F;--ink:#E4EBEC;--ink-2:#9AABB0;--line:#2A373C;
    --accent:#5CB5AB;--accent-ink:#0B1A19;--accent-soft:#1B3633;--ochre:#E1A652;--ochre-soft:#3A2D1C;--done:#6CC08E;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F1517;--surface:#172024;--surface-2:#1F2A2F;--ink:#E4EBEC;--ink-2:#9AABB0;--line:#2A373C;
  --accent:#5CB5AB;--accent-ink:#0B1A19;--accent-soft:#1B3633;--ochre:#E1A652;--ochre-soft:#3A2D1C;--done:#6CC08E;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* header */
.top{padding-block:22px 12px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
.dday{font-family:var(--mono);font-size:13px;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:999px;white-space:nowrap}
.route{font-size:13px;color:var(--ink-2)}
.sync{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.sync.ok i{background:var(--done)} .sync.busy i{background:var(--ochre)}

/* day strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;min-width:58px;text-align:center;cursor:pointer;line-height:1.25}
.chip b{display:block;font-family:var(--mono);font-size:15px}
.chip span{font-size:11px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}

/* day */
.day-head{padding-block:18px 6px}
.day-head .date{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.day-head h2{font-family:var(--serif);font-size:24px;margin:2px 0 4px;line-height:1.25;text-wrap:balance}
.day-head p{margin:0;font-size:13px;color:var(--ink-2)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.art{background:var(--accent-soft);color:var(--accent)}
.tag.site{background:var(--ochre-soft);color:var(--ochre)}

.ticket{margin-block:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 16px;position:relative}
.ticket .op{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:4px;gap:8px;flex-wrap:wrap}
.ticket .op b{color:var(--accent);font-weight:600;letter-spacing:.08em}
.st{display:flex;flex-direction:column}
.st.r{text-align:right}
.st .tm{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.st .nm{font-size:12px;color:var(--ink-2)}
.ticket .dur{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:center}
.ticket .dur::before{content:"";display:block;height:1px;background:var(--line);margin-bottom:4px;min-width:40px}

.tl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:54px 1fr;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .t{font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:1px}
.tl .c{display:flex;flex-direction:column;gap:3px;min-width:0}
.tl .n{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl .d{font-size:13px;color:var(--ink-2)}
.tl li.key .n{color:var(--accent)}
.tl .bk{font-size:11px;font-weight:600;color:var(--ochre);border:1px solid currentColor;border-radius:5px;padding:0 5px}

.note{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.note b{color:var(--ink);font-weight:600}

/* sections */
.sec-title{font-family:var(--serif);font-size:22px;margin:22px 0 4px}
.sec-sub{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.group{margin-top:18px}
.group h3{font-size:12px;letter-spacing:.1em;color:var(--ink-2);margin:0 0 8px;font-weight:600}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.plabel{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:6px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;margin:1px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.row input:checked{background:var(--done);border-color:var(--done)}
.row input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row .body{display:flex;flex-direction:column;gap:2px;min-width:0}
.row label{font-weight:600;cursor:pointer}
.row.is-done label{text-decoration:line-through;color:var(--ink-2)}
.row .meta{font-size:12.5px;color:var(--ink-2)}
.row .open{font-size:12.5px;color:var(--ochre);font-weight:500}
.row a{font-size:12.5px;font-weight:500;text-decoration:none}
.row a:hover{text-decoration:underline}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stack{display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:15px}
.card p{margin:0;font-size:13px;color:var(--ink-2)}
.card ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.fare{width:100%;border-collapse:collapse;font-size:13px}
.fare th,.fare td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.fare th{font-weight:600;color:var(--ink-2);font-size:12px;border-top:0}
.fare .pick td{background:var(--accent-soft)}
.tbl{overflow-x:auto}

.eat{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.eat:first-of-type{border-top:0}
.eat b{font-weight:600}
.eat span{font-size:13px;color:var(--ink-2)}
.dish{font-size:13px;color:var(--accent);font-weight:500}

/* booking timeline */
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:22px 1fr;gap:12px;position:relative;padding-bottom:14px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-2);position:relative;z-index:1}
.step.done .dot{background:var(--done);border-color:var(--done);color:#fff}
.step.next .dot{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step .when{font-family:var(--mono);font-size:12px;color:var(--ochre);font-weight:500}
.step.done .when{color:var(--ink-2)}
.step .what{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step .badge{font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 6px}
.step .why{font-size:12.5px;color:var(--ink-2)}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--done);text-decoration:line-through}
.timeline-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}

.brand{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:48px;height:48px;border-radius:12px;flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.15)}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:640px}
.nav button{background:none;border:0;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2);border-radius:10px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

function buildDoc(){
  var json = JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8">'
   + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
   + '<title>Luna di Miele 2027</title>' + FONT_SRC + STYLE_SRC
   + '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>'
   + '</head><body><div id="app"></div><script id="state" type="application/json">' + json + '<\/script>'
   + CODE_SRC + '</body></html>';
}
function schedulePublish(){
  lsSet('ldm-checked', JSON.stringify(state.checked));
  if(syncMode!=='cloud') return;
  syncBusy = true; renderSync();
  clearTimeout(pubTimer);
  pubTimer = setTimeout(function(){
    artifactApi.publish(buildDoc()).then(function(){ syncBusy=false; renderSync(); })
    .catch(function(err){
      var code = err && err.code;
      if(code==='not_granted' || code==='not_writer'){ syncMode='local'; }
      syncBusy=false; renderSync();
    });
  }, 2200);
}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function kindTag(k){ var cls = k==='미술관'?'art':(k==='유적'?'site':''); return '<span class="tag '+cls+'">'+esc(k)+'</span>'; }
function totalBook(){ var n=0,d=0; BOOK.forEach(function(g){ g.items.forEach(function(it){ n++; if(state.checked[it.id]) d++; }); }); return [d,n]; }
function dday(){
  var t = new Date(); t = new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var diff = Math.round((TRIP_START - t)/864e5);
  if(diff>0) return 'D-'+diff;
  if(diff>-10) return '여행 '+(1-diff)+'일째';
  return '다녀왔어요';
}

    + '</tbody></table></div></section>';
  h += '<section class="group"><h3>기억할 것</h3><div class="stack">'
    + '<div class="card"><h4>탑승 전</h4><ul><li>플랫폼은 출발 10~15분 전에 전광판에 떠요</li><li>이탈로·고속열차는 QR만 보여주면 돼요</li><li>지역열차 종이표는 노란 기계에 각인 필수</li></ul></div>'
    + '<div class="card"><h4>역 이름 확인</h4><ul><li>베네치아는 Mestre가 아닌 <b>S. Lucia</b></li><li>피렌체는 Rifredi·Campo di Marte가 아닌 <b>S.M.N.</b></li><li>로마는 Tiburtina가 아닌 <b>Termini</b></li></ul></div>'
    + '<div class="card"><h4>이탈로 고객센터</h4><p>+39 06 89371892 · 이탈리아 06:00~23:00 (한국 오후 2시~새벽 7시, 1월 기준)</p><p>결제만 되고 티켓이 안 오면 Claim form → "Amount charged without issuing a ticket code"</p><a href="https://www.italotreno.com/en/support-contacts/claim" target="_blank" rel="noopener">Claim form ↗</a></div>'
    + '</div></section>';
  return h;
}

function viewEat(){
  var h = '<h2 class="sec-title">맛집</h2><p class="sec-sub">일·월요일 휴무가 많아요. 방문 전 구글맵에서 영업일을 확인하세요.</p><div class="stack">';
  EATS.forEach(function(c){
    h += '<div class="card"><h4>'+esc(c.c)+'</h4><div class="dish">'+esc(c.dish)+'</div>';
    c.p.forEach(function(p){ h += '<div class="eat"><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></div>'; });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function navBar(){
  var tabs = [['plan','일정'],['book','예약'],['move','이동'],['eat','맛집']];
  return '<nav class="nav" aria-label="메뉴"><div>'+tabs.map(function(t){
    return '<button data-tab="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+ICONS[t[0]]+'<span>'+t[1]+'</span></button>';
  }).join('')+'</div></nav>';
}

function render(){
  var body = ui.tab==='book'?viewBook():ui.tab==='move'?viewMove():ui.tab==='eat'?viewEat():viewPlan();
  app.innerHTML = '<div class="wrap">'+header()+body+'</div>'+navBar();
  renderSync();
  var active = app.querySelector('.chip[aria-pressed="true"]');
  if(active && active.scrollIntoView){ try{ active.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){} }
}

app.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab]');
  if(t){ ui.tab = t.getAttribute('data-tab'); saveUi(); render(); window.scrollTo(0,0); return; }
  var c = e.target.closest('[data-day]');
  if(c){ ui.day = c.getAttribute('data-day'); saveUi(); render(); return; }
});
app.addEventListener('change', function(e){
  var id = e.target.getAttribute && e.target.getAttribute('data-check');
  if(!id) return;
  if(e.target.checked) state.checked[id] = true; else delete state.checked[id];
  var y = window.scrollY; render(); window.scrollTo(0,y);
  var el = document.getElementById(id); if(el) el.focus();
  schedulePublish();
});

render();

if(window.claude && typeof window.claude.use === 'function'){
  window.claude.use('artifact').then(function(a){
    if(a){ artifactApi = a; syncMode = 'cloud'; }
    else { applyLocalOverlay(); }
    render();
  }).catch(function(){ applyLocalOverlay(); render(); });
} else {
  applyLocalOverlay(); render();
}
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){r.update();}).catch(function(){});var had=!!navigator.serviceWorker.controller,done=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!done){done=true;location.reload();}});});}
</script>
</body>
</html>
